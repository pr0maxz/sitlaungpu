<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประตูสู่เมืองลับแล - เฉพาะผู้คุมกฎ</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/kjdb7wyp/image/upload/v1787985668/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { 
            --bg-deep: #070402; --bg-glow: #2a1805; 
            --gold-light: #f5d77f; --gold-main: #d4af37; --gold-dark: #8a6315; 
            --text-muted: #8a7761; --danger-color: #ff6b6b; 
        }
        
        body { 
            background-color: var(--bg-deep); 
            background-image: radial-gradient(circle at 50% 50%, var(--bg-glow) 0%, var(--bg-deep) 90%); 
            color: #d1bfae; 
            font-family: 'Sarabun', sans-serif; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            position: relative;
        }
        
        body::before { content: ""; position: fixed; top: -50vh; left: -50vw; width: 200vw; height: 200vh; z-index: -2; pointer-events: none; background-image: radial-gradient(2px 2px at 40px 60px, var(--gold-light), transparent), radial-gradient(1.5px 1.5px at 150px 120px, var(--gold-main), transparent), radial-gradient(2.5px 2.5px at 90px 200px, var(--gold-light), transparent), radial-gradient(1.5px 1.5px at 110px 90px, var(--gold-light), transparent); background-size: 200px 200px; opacity: 0.4; animation: floatingMagic 15s linear infinite; will-change: transform; }
        body::after { content: ""; position: fixed; top: -50vh; left: -50vw; width: 200vw; height: 200vh; z-index: -1; pointer-events: none; background-image: radial-gradient(3px 3px at 20px 30px, var(--gold-main), transparent), radial-gradient(2px 2px at 120px 80px, var(--gold-light), transparent), radial-gradient(3px 3px at 220px 150px, var(--gold-dark), transparent); background-size: 350px 350px; opacity: 0.25; animation: floatingMagic2 22s linear infinite; will-change: transform; }
        @keyframes floatingMagic { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(200px, -200px, 0); } } 
        @keyframes floatingMagic2 { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-350px, -350px, 0); } }

        @keyframes containerPulse { 
            0% { box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 20px rgba(212,175,55,0.02); } 
            50% { box-shadow: 0 0 60px rgba(212,175,55,0.2), inset 0 0 40px rgba(212,175,55,0.1); } 
            100% { box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 20px rgba(212,175,55,0.02); } 
        }

        .login-box {
            position: relative;
            background: linear-gradient(135deg, rgba(26, 18, 11, 0.95), rgba(10, 6, 3, 0.95));
            border: 1px solid var(--gold-main);
            border-radius: 12px;
            width: 90%;
            max-width: 420px;
            padding: 50px 40px;
            backdrop-filter: blur(10px);
            animation: containerPulse 5s infinite alternate;
            z-index: 10;
        }

        .corner-decor { position: absolute; width: 60px; height: 60px; pointer-events: none; opacity: 0.8; } 
        .mc-top-left { top: 12px; left: 12px; transform: scaleX(-1); } 
        .mc-top-right { top: 12px; right: 12px; } 
        .mc-bottom-left { bottom: 12px; left: 12px; transform: scaleX(-1) scaleY(-1); } 
        .mc-bottom-right { bottom: 12px; right: 12px; transform: scaleY(-1); }

        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header img { height: 70px; width: auto; margin-bottom: 15px; filter: drop-shadow(0 0 15px rgba(212,175,55,0.5)); }
        .login-header h1 { color: var(--gold-light); font-family: 'Prompt', sans-serif; font-size: 1.8rem; margin-bottom: 5px; text-shadow: 0 2px 5px rgba(0,0,0,0.9); }
        .login-header p { color: var(--gold-dark); font-size: 0.95rem; }

        .form-group { margin-bottom: 25px; position: relative; } 
        .form-group label { display: block; color: var(--gold-main); font-family: 'Prompt', sans-serif; font-size: 0.95rem; margin-bottom: 8px; } 
        
        .form-input { 
            width: 100%; 
            background: rgba(0,0,0,0.7); 
            border: 1px solid rgba(138, 99, 21, 0.5); 
            color: #fff; 
            padding: 14px 15px; 
            border-radius: 8px; 
            font-family: 'Sarabun', sans-serif; 
            font-size: 1.05rem; 
            transition: all 0.3s;
        } 
        .form-input:focus { outline: none; border-color: var(--gold-light); box-shadow: 0 0 15px rgba(212,175,55,0.3); }

        .toggle-password { position: absolute; right: 15px; top: 42px; cursor: pointer; font-size: 0.9rem; color: var(--gold-main); opacity: 0.8; } 
        .toggle-password:hover { opacity: 1; text-shadow: 0 0 5px var(--gold-main); }

        .btn-submit { 
            width: 100%; 
            background: linear-gradient(180deg, #d4af37 0%, #8a6315 100%); 
            color: #150a03; 
            border: none; 
            padding: 14px; 
            border-radius: 25px; 
            font-family: 'Prompt', sans-serif; 
            font-weight: bold; 
            font-size: 1.1rem; 
            cursor: pointer; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.8); 
            transition: all 0.3s; 
            margin-top: 10px;
        } 
        .btn-submit:hover { filter: brightness(1.2); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212,175,55,0.4); }

        .back-link { 
            display: block; 
            text-align: center; 
            margin-top: 25px; 
            color: var(--text-muted); 
            text-decoration: none; 
            font-size: 0.9rem; 
            transition: color 0.3s; 
        }
        .back-link:hover { color: var(--gold-light); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 4, 2, 0.85); backdrop-filter: blur(8px); z-index: 999; justify-content: center; align-items: center; } 
        .modal-overlay.active { display: flex; }
        .modal-box { background: linear-gradient(135deg, #1a120b, #0a0603); border: 1px solid var(--danger-color); border-radius: 12px; width: 90%; max-width: 350px; padding: 30px; position: relative; box-shadow: 0 15px 40px rgba(0,0,0,0.9); text-align: center; }
        .modal-box.success { border-color: #73c990; }
        .modal-box h3 { font-family: 'Prompt', sans-serif; margin-bottom: 15px; color: var(--danger-color); }
        .modal-box.success h3 { color: #73c990; }
        .modal-box p { color: #e2d4c3; font-size: 1rem; margin-bottom: 25px; line-height: 1.5; }
        .btn-close-modal { background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); padding: 8px 25px; border-radius: 20px; font-family: 'Prompt', sans-serif; cursor: pointer; }
        .btn-close-modal:hover { background: rgba(255,255,255,0.1); color: #fff; }

        /* 🚀 อาคมลดภาระเครื่อง (Optimization สำหรับแท็บเล็ตและมือถือ) */
@media (max-width: 1024px) {
    /* 1. ปิดกระจกฝ้า เปลี่ยนเป็นสีพื้นหลังแบบทึบขึ้นแทน */
    .main-container {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        background-color: rgba(7, 4, 2, 0.98) !important;
    }
    
    /* 2. หยุดกรอบแสงวิ่ง เปลี่ยนเป็นกรอบสีทองนิ่งๆ */
    .main-container::before {
        animation: none !important;
        background: var(--gold-main) !important;
        -webkit-mask: none !important;
        padding: 1px;
    }
    
    /* 3. หยุดละอองเวทมนตร์ลอยไปมา ให้หยุดนิ่งเป็นพื้นหลังธรรมดา */
    body::before, body::after {
        animation: none !important;
    }

    /* 4. หยุดการกะพริบของมุมลายไทยและลูกแก้วแจ้งเตือน */
    .corner-decor, .noti-btn {
        animation: none !important;
    }
}
    </style>
</head>
<body>

    <div class="login-box">
        <!-- 🌟 เพิ่ม width และ height ให้ภาพมุมกล่องเพื่อป้องกัน CLS -->
        <img src="https://res.cloudinary.com/kjdb7wyp/image/upload/v1788019928/corner.png" class="corner-decor mc-top-left" alt="" width="60" height="60">
        <img src="https://res.cloudinary.com/kjdb7wyp/image/upload/v1788019928/corner.png" class="corner-decor mc-top-right" alt="" width="60" height="60">
        <img src="https://res.cloudinary.com/kjdb7wyp/image/upload/v1788019928/corner.png" class="corner-decor mc-bottom-left" alt="" width="60" height="60">
        <img src="https://res.cloudinary.com/kjdb7wyp/image/upload/v1788019928/corner.png" class="corner-decor mc-bottom-right" alt="" width="60" height="60">

        <div class="login-header">
            <!-- 🌟 เพิ่ม width และ height ให้โลโก้หลัก -->
            <img src="https://res.cloudinary.com/kjdb7wyp/image/upload/v1788019626/logo.png" alt="โลโก้สำนัก" width="210" height="70">
            <h1>ประตูสู่เมืองลับแล</h1>
            <p>สถานที่นี้สงวนไว้สำหรับ "ผู้คุมกฏ" เท่านั้น</p>
        </div>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label>นามแห่งเจ้า (Username)</label>
                <input type="text" id="adminUser" class="form-input" placeholder="จงแจ้งนามของท่าน..." required>
            </div>
            
            <div class="form-group">
                <label>รหัสผ่านอาคม (Password)</label>
                <input type="password" id="adminPass" class="form-input" placeholder="ร่ายมนตราเพื่อเปิดทาง..." required>
                <span class="toggle-password" onclick="togglePassword()">เพ่งมอง</span>
            </div>

            <button type="submit" class="btn-submit" id="loginBtn">ล่วงล้ำเขตแดน (Login)</button>
            <a href="index.html" class="back-link">← ถอยกลับสู่โลกเบื้องหน้า</a>
        </form>
    </div>

    <!-- Alert Modal -->
    <div class="modal-overlay" id="alertModal">
        <div class="modal-box" id="alertBox">
            <h3 id="alertTitle">อาถรรพ์ต่อต้าน!</h3>
            <p id="alertMessage">มนตราป้องกันทำงาน... เจ้าไม่ใช่คนของเมืองนี้!</p>
            <button type="button" class="btn-close-modal" onclick="closeAlert()">รับทราบ</button>
        </div>
    </div>

    <script>
        const API_CONFIG = { 
            USE_REAL_API: true, 
            BASE_URL: "https://my-backend.pr0maxz.workers.dev/api" 
        };

        function togglePassword() {
            const pwdInput = document.getElementById('adminPass');
            const toggleIcon = document.querySelector('.toggle-password');
            if (pwdInput.type === 'password') { 
                pwdInput.type = 'text'; 
                toggleIcon.textContent = 'หลับตา'; 
            } else { 
                pwdInput.type = 'password'; 
                toggleIcon.textContent = 'เพ่งมอง'; 
            }
        }

        function showAlert(title, message, isSuccess = false) {
            document.getElementById('alertTitle').textContent = title;
            document.getElementById('alertMessage').textContent = message;
            
            const box = document.getElementById('alertBox');
            if(isSuccess) {
                box.classList.add('success');
            } else {
                box.classList.remove('success');
            }

            document.getElementById('alertModal').classList.add('active');
        }

        function closeAlert() {
            document.getElementById('alertModal').classList.remove('active');
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const username = document.getElementById('adminUser').value.trim();
            const password = document.getElementById('adminPass').value.trim();
            const btn = document.getElementById('loginBtn');

            btn.textContent = 'กำลังร่ายมนตรา...';
            btn.disabled = true;

            try {
                let response;
                if (API_CONFIG.USE_REAL_API) {
                    response = await fetch(`${API_CONFIG.BASE_URL}/admin/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                } else {
                    let usersDB = JSON.parse(localStorage.getItem('siy_users')) || [];
                    const foundUser = usersDB.find(u => u.username === username);
                    if (!foundUser || foundUser.password !== password || foundUser.role !== '1') {
                        throw new Error('นามหรือรหัสผ่านอาคมไม่ถูกต้อง!');
                    }
                    response = { ok: true, json: async () => ({ success: true, username: foundUser.username }) };
                }

                const result = await response.json();

                if (!response.ok || !result.success) {
                    showAlert('อาถรรพ์สะท้อนกลับ!', result.error || 'รหัสผ่านอาคมผิดเพี้ยน หรือท่านไม่ใช่ "ปรมัตถ์"!');
                    btn.textContent = 'ล่วงล้ำเขตแดน (Login)';
                    btn.disabled = false;
                    return;
                }

                showAlert('ยินดีต้อนรับ', 'มนตราบรรลุผล... ประตูเมืองลับแลเปิดออกแล้วท่านจ้าวปะรำพิธี', true);
                
                localStorage.setItem('siy_username', result.username || username);
                localStorage.setItem('siy_usertype', 'admin');

                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1500);

            } catch (error) {
                console.error('Login Error:', error);
                showAlert('ผู้บุกรุก!', 'เกิดอาถรรพ์ขัดข้องในการเชื่อมต่อสู่แก่นเซิร์ฟเวอร์');
                btn.textContent = 'ล่วงล้ำเขตแดน (Login)';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
